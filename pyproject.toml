[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trajectory-explorer"
dynamic = ["version"]
description = "Weight-only diff tool for model checkpoints: see when each part of a model learns."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aryan Pillai" }]
requires-python = ">=3.10"
keywords = ["machine-learning", "interpretability", "checkpoints", "safetensors", "pythia"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Runtime dependencies are deliberately minimal. The safetensors format is read by our own
# small reader, so the safetensors library is only needed by the tests (as a reference).
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff==0.16.8",
    "safetensors>=0.4.3",
]

[project.scripts]
trajectory-explorer = "trajectory_explorer.cli:main"

[project.urls]
Repository = "https://github.com/Aryan-Pillai7/trajectory-explorer"

[tool.hatch.version]
path = "src/trajectory_explorer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow and not network"]
markers = [
    "unit: fast, isolated tests of a single function or class",
    "integration: several components together, e.g. a CLI run on synthetic checkpoints",
    "slow: takes more than a few seconds (excluded by default)",
    "network: downloads real checkpoints (excluded by default; opt in with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
